! ==============================================================================
! IPv6 Dual-Stack Configuration Snippet: SW-D3 (Remote Clinic Distribution)
! Disaster-Resilient Smart Hospital Network
! ==============================================================================
sdm prefer dual-ipv4-and-ipv6 default
ipv6 unicast-routing
!
interface GigabitEthernet0/2
 description Routed Uplink to R2 Gi0/0
 no switchport
 ipv6 address fe80::d3 link-local
 ipv6 address 2001:db8:acad:96::2/64
 ipv6 ospf 1 area 0
!
interface Vlan10
 description Remote Clinic Triage Telemetry IPv6 Gateway
 ipv6 address fe80::d3 link-local
 ipv6 address 2001:db8:acad:10::3/64
 ipv6 ospf 1 area 2
!
interface Vlan30
 description Remote Clinic Consultation IPv6 Gateway
 ipv6 address fe80::d3 link-local
 ipv6 address 2001:db8:acad:30::3/64
 ipv6 ospf 1 area 2
!
ipv6 router ospf 1
 router-id 172.16.8.107
 log-adjacency-changes
 passive-interface Vlan10
 passive-interface Vlan30
!
