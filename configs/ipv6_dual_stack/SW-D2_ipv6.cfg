! ==============================================================================
! IPv6 Dual-Stack Configuration Snippet: SW-D2 (Secondary Distribution Switch)
! Disaster-Resilient Smart Hospital Network
! ==============================================================================
sdm prefer dual-ipv4-and-ipv6 default
ipv6 unicast-routing
!
interface GigabitEthernet0/2
 description Routed Uplink to R1 Gi0/1
 no switchport
 ipv6 address fe80::d2 link-local
 ipv6 address 2001:db8:acad:92::1/64
 ipv6 ospf 1 area 0
!
interface Vlan20
 description Operating Theatre IPv6 Gateway
 ipv6 address fe80::d2 link-local
 ipv6 address 2001:db8:acad:20::2/64
 ipv6 ospf 1 area 1
!
interface Vlan40
 description Diagnostic Imaging IPv6 Gateway
 ipv6 address fe80::d2 link-local
 ipv6 address 2001:db8:acad:40::2/64
 ipv6 ospf 1 area 1
!
interface Vlan60
 description Guest Wi-Fi IPv6 Gateway
 ipv6 address fe80::d2 link-local
 ipv6 address 2001:db8:acad:60::2/64
 ipv6 ospf 1 area 1
!
ipv6 router ospf 1
 router-id 172.16.8.105
 log-adjacency-changes
 passive-interface Vlan20
 passive-interface Vlan40
 passive-interface Vlan60
!
