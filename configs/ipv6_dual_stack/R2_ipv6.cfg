! ==============================================================================
! IPv6 Dual-Stack Configuration Snippet: R2 (Clinic Router)
! Disaster-Resilient Smart Hospital Network
! ==============================================================================
ipv6 unicast-routing
!
interface Loopback0
 ipv6 address 2001:db8:acad:107::1/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description Routed Uplink to SW-D3 Gi0/1
 ipv6 address fe80::2 link-local
 ipv6 address 2001:db8:acad:96::2/64
 ipv6 ospf 1 area 0
 ipv6 ospf cost 1
!
interface Serial0/0/0
 description Primary Serial WAN to R1 (Area 0 Backbone)
 ipv6 address fe80::2 link-local
 ipv6 address 2001:db8:acad:80::2/64
 ipv6 ospf 1 area 0
 ipv6 ospf cost 64
!
interface Serial0/0/1
 description Secondary Backup Serial WAN to R1
 ipv6 address fe80::2 link-local
 ipv6 address 2001:db8:acad:84::2/64
 ipv6 ospf 1 area 0
 ipv6 ospf cost 500
!
ipv6 router ospf 1
 router-id 172.16.8.107
 log-adjacency-changes
!
