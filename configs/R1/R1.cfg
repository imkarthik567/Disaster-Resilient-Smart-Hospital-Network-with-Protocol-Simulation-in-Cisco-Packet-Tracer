! ==============================================================================
! DEVICE:       R1
! HOSTNAME:     R1 (Main Hospital - Core Router)
! MODEL:        Cisco 2911 Integrated Services Router
! MODULES:      HWIC-2T installed in Slot 0 (provides Serial0/0/0 & Serial0/0/1)
! WAN PRIMARY:  Serial0/0/0 (DCE) -> R2 Se0/0/0 [OSPF Area 0 Backbone, AD 110]
! WAN BACKUP:   Serial0/0/1 (DCE) -> R2 Se0/0/1 [EIGRP AS 100 Standby, AD adjusted to 120]
! LAN LINKS:    Gig0/0 -> SW-D1 Gi0/2 (172.16.8.88/30), Gig0/1 -> SW-D2 Gi0/2 (172.16.8.92/30)
! INTERNET:     Gig0/2 -> EDGE-ISP Gi0/0 (172.16.8.100/30) with NAT Overload (PAT)
! LOOPBACK0:    172.16.8.104/32 (OSPF Router ID & Management)
! ==============================================================================

enable
configure terminal

hostname R1

! --- Disable DNS Lookup & Set Banner ---
no ip domain-lookup
banner motd ^C
====================================================================
  R1: Main Hospital Core Router - VIT SCOPE CN Project
  Primary Backbone Gateway with Multi-Area OSPF & EIGRP Failover
====================================================================
^C

! --- Management Credentials & Line Security ---
enable secret class
line con 0
 password cisco
 login
 logging synchronous
 exec-timeout 15 0
exit

line vty 0 4
 password cisco
 login
 transport input ssh telnet
 exec-timeout 15 0
exit

! --- Loopback0 Interface (OSPF Router ID) ---
interface Loopback0
 description OSPF_Router_ID_and_Management
 ip address 172.16.8.104 255.255.255.255
 no shutdown
exit

! --- LAN Point-to-Point Uplinks to Distribution Switches ---
interface GigabitEthernet0/0
 description Link_to_SW-D1_Gi0/2
 ip address 172.16.8.90 255.255.255.252
 ip ospf network point-to-point
 ip nat inside
 no shutdown
exit

interface GigabitEthernet0/1
 description Link_to_SW-D2_Gi0/2
 ip address 172.16.8.94 255.255.255.252
 ip ospf network point-to-point
 ip nat inside
 no shutdown
exit

! --- Cryptographic Key-Chain for EIGRP Authentication ---
key chain EIGRP_AUTH
 key 1
  key-string CiscoHospital2026
exit

! --- Primary WAN Link (Serial0/0/0 - DCE): OSPF Area 0 Backbone ---
interface Serial0/0/0
 description Primary_WAN_Link_to_R2_Se0/0/0_OSPF_Area0
 ip address 172.16.8.81 255.255.255.252
 clock rate 128000
 bandwidth 2048
 ip ospf network point-to-point
 ip ospf cost 48
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 CiscoHospital2026
 ip nat inside
 no shutdown
exit

! --- Secondary WAN Link (Serial0/0/1 - DCE): Standby EIGRP AS 100 ---
interface Serial0/0/1
 description Standby_WAN_Link_to_R2_Se0/0/1_EIGRP_Backup
 ip address 172.16.8.85 255.255.255.252
 clock rate 128000
 bandwidth 1544
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 EIGRP_AUTH
 ip nat inside
 no shutdown
exit

! --- Internet Edge Interface (GigabitEthernet0/2): ISP Gateway ---
interface GigabitEthernet0/2
 description Internet_Edge_Uplink_to_ISP
 ip address 172.16.8.102 255.255.255.252
 ip nat outside
 no shutdown
exit

! --- Default Route to ISP Gateway ---
ip route 0.0.0.0 0.0.0.0 172.16.8.101

! --- NAT Overload (PAT) Configuration ---
ip access-list standard NAT-ACL
 remark Permit entire hospital internal 172.16.0.0/16 address space
 permit 172.16.0.0 0.0.255.255
exit

ip nat inside source list NAT-ACL interface GigabitEthernet0/2 overload

! --- Dynamic Routing: Multi-Area OSPF Process 1 (Primary Path) ---
router ospf 1
 router-id 172.16.8.104
 ! Originate Type-5 AS-External default route toward core switches & Remote Clinic
 default-information originate
 ! Security: Passive-interface default prevents rogue adjacencies on untrusted ports
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 no passive-interface Serial0/0/0
 no passive-interface Loopback0
 ! Core Backbone Area 0 Advertisements
 network 172.16.8.104 0.0.0.0 area 0       ! Loopback0
 network 172.16.8.80 0.0.0.3 area 0         ! Primary Serial WAN (Se0/0/0)
 network 172.16.8.88 0.0.0.3 area 0         ! Routed link to SW-D1 (Gi0/0)
 network 172.16.8.92 0.0.0.3 area 0         ! Routed link to SW-D2 (Gi0/1)
exit

! --- Dynamic Routing: EIGRP AS 100 (Secondary Standby Path) ---
! CRITICAL: Default EIGRP AD is 90, which beats OSPF (110).
! By raising EIGRP internal AD to 120, OSPF is ALWAYS preferred when primary WAN is UP.
router eigrp 100
 no auto-summary
 network 172.16.8.84 0.0.0.3                ! Secondary Serial WAN (Se0/0/1)
 network 172.16.8.88 0.0.0.3                ! Routed link to SW-D1
 network 172.16.8.92 0.0.0.3                ! Routed link to SW-D2
 network 172.16.0.0 0.0.255.255              ! Hospital subnets
 distance eigrp 120 170
 passive-interface default
 no passive-interface Serial0/0/1
exit

! --- Quality of Service (QoS): Modular QoS CLI (MQC) ---
class-map match-any VITALS-VOICE
 match ip dscp ef
exit

class-map match-any IMAGING
 match ip dscp af31
exit

policy-map HOSPITAL-QOS
 class VITALS-VOICE
  priority percent 30
 class IMAGING
  bandwidth percent 40
 class class-default
  fair-queue
exit

! Apply QoS policy egress on WAN links
interface Serial0/0/0
 service-policy output HOSPITAL-QOS
exit

interface Serial0/0/1
 service-policy output HOSPITAL-QOS
exit

end
write memory

! ==============================================================================
! VERIFICATION COMMANDS & EXPECTED OUTPUT
! ==============================================================================
!
! 1. Verify OSPF Neighbor Adjacencies (Expect 3 Full Neighbors):
!    R1# show ip ospf neighbor
!    EXPECTED OUTPUT:
!    Neighbor ID     Pri   State           Dead Time   Address         Interface
!    172.16.8.105      0   FULL/  -        00:00:03    172.16.8.82     Serial0/0/0
!    172.16.8.106      0   FULL/  -        00:00:34    172.16.8.89     GigabitEthernet0/0
!    172.16.8.107      0   FULL/  -        00:00:36    172.16.8.93     GigabitEthernet0/1
!    (Notice: Point-to-point network type eliminates DR/BDR election)
!
! 2. Verify EIGRP Standby Neighbor Adjacency:
!    R1# show ip eigrp neighbors
!    EXPECTED OUTPUT:
!    H   Address          Interface       Hold  Uptime    SRTT   RTO   Q   Seq
!    0   172.16.8.86      Se0/0/1           12  00:10:45   24    200   0   14
!
! 3. Verify Active Routing Table (Normal State - Primary Link UP):
!    R1# show ip route
!    EXPECTED OUTPUT:
!    Gateway of last resort is 172.16.8.101 to network 0.0.0.0
!    S*   0.0.0.0/0 [1/0] via 172.16.8.101
!         172.16.0.0/16 is variably subnetted, 18 subnets, 6 masks
!    O    172.16.0.0/22 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                       [110/2] via 172.16.8.93, GigabitEthernet0/1 (Guest Wi-Fi)
!    O    172.16.4.0/23 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                       [110/2] via 172.16.8.93, GigabitEthernet0/1 (Admin)
!    O    172.16.6.0/25 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                       [110/2] via 172.16.8.93, GigabitEthernet0/1 (VoIP)
!    O IA 172.16.6.128/25 [110/49] via 172.16.8.82, Serial0/0/0 (Clinic Guest Summary)
!    O    172.16.7.0/26 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                       [110/2] via 172.16.8.93, GigabitEthernet0/1 (Server Farm)
!    O    172.16.7.64/26 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                        [110/2] via 172.16.8.93, GigabitEthernet0/1 (Surgery)
!    O    172.16.7.128/26 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                         [110/2] via 172.16.8.93, GigabitEthernet0/1 (ICU)
!    O    172.16.7.192/27 [110/2] via 172.16.8.89, GigabitEthernet0/0
!                         [110/2] via 172.16.8.93, GigabitEthernet0/1 (Mgmt)
!    O IA 172.16.7.224/27 [110/49] via 172.16.8.82, Serial0/0/0 (Clinic Voice Summary)
!    O IA 172.16.8.0/24 [110/49] via 172.16.8.82, Serial0/0/0 (Clinic Campus Summary)
!    (Notice: Remote clinic subnets are learned as O IA via Serial0/0/0, NOT EIGRP)
!
! 4. Verify EIGRP Topology Table (Standby Routes Ready in Feasible Successor state):
!    R1# show ip eigrp topology
!    EXPECTED OUTPUT:
!    IP-EIGRP Topology Table for AS(100)/ID(172.16.8.104)
!    P 172.16.8.0/24, 1 successors, FD is 2172416, via 172.16.8.86 (Serial0/0/1)
!
! 5. Test Failover Reconvergence (Simulating Primary WAN Cable Cut):
!    R1(config)# interface Serial0/0/0
!    R1(config-if)# shutdown
!    Wait ~4 seconds for OSPF dead-interval expiry, then check routing table:
!    R1# show ip route
!    EXPECTED OUTPUT:
!    D    172.16.8.0/24 [120/2172416] via 172.16.8.86, Serial0/0/1  <-- EIGRP TAKES OVER!
!    D    172.16.6.128/25 [120/2172416] via 172.16.8.86, Serial0/0/1
!    D    172.16.7.224/27 [120/2172416] via 172.16.8.86, Serial0/0/1
!
! 6. Restore Primary Link:
!    R1(config)# interface Serial0/0/0
!    R1(config-if)# no shutdown
!    R1# show ip route
!    EXPECTED OUTPUT:
!    O IA 172.16.8.0/24 [110/49] via 172.16.8.82, Serial0/0/0  <-- OSPF RESTORED!
!
! 7. Verify NAT Translations:
!    R1# show ip nat translations
!    EXPECTED OUTPUT:
!    Pro Inside global         Inside local          Outside local         Outside global
!    icmp 172.16.8.102:1       172.16.7.141:1        8.8.8.8:1             8.8.8.8:1
! ==============================================================================
