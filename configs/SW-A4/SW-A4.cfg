!                                                 Fa0/5, Fa0/6, Fa0/7, Fa0/8,
!                                                 Fa0/9, Fa0/11, Fa0/12, Fa0/13,
!                                                 Fa0/14, Fa0/15, Fa0/16, Fa0/17,
!                                                 Fa0/18, Fa0/19, Fa0/20, Fa0/21,
!                                                 Fa0/22, Fa0/23, Fa0/24
