version 15.0
service password-encryption
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service config
!
hostname SW-A1
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
no ip domain-lookup
ip domain-name hospital.local
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
vtp mode transparent
!
vlan 10
 name ICU_TELEMETRY
!
vlan 20
 name SURGERY_THEATRE
!
vlan 30
 name GENERAL_ADMIN
!
vlan 40
 name IMAGING_PACS
!
vlan 50
 name SERVER_FARM
!
vlan 60
 name GUEST_WIFI
!
vlan 99
 name NOC_MANAGEMENT
!
vlan 999
 name PARKING_LOT
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
interface GigabitEthernet0/1
 description Uplink to SW-D1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,60,99
 no shutdown
!
interface GigabitEthernet0/2
 description Uplink to SW-D2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,60,99
 no shutdown
!
interface range FastEthernet0/1 - 6
 switchport mode access
 switchport access vlan 10
spanning-tree portfastspanning-tree bpduguard enableno shutdown!
interface range FastEthernet0/7 - 24
 switchport mode access
 switchport access vlan 999
shutdown!
interface Vlan99
 description Out-of-Band Management Interface
 ip address 172.16.8.68 255.255.255.240
 no shutdown
!
ip default-gateway 172.16.8.65
!
ip ssh version 2
!
banner motd ^C
================================================================================
AUTHORIZED ACCESS ONLY - DISASTER-RESILIENT SMART HOSPITAL NETWORK
================================================================================
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
line vty 5 15
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end
