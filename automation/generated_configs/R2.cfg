! ==============================================================================
! Generated Cisco IOS Configuration: R2
! Template: router.j2 | Pipeline: NetDevOps Jinja2 Generator
! Disaster-Resilient Smart Hospital Network
! ==============================================================================
version 15.1
service password-encryption
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service config
!
hostname R2
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
no ip domain-lookup
ip domain-name hospital.local
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
interface Loopback0
 description OSPF Router-ID & Management Loopback
 ip address 172.16.8.107 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Routed Uplink to SW-D3 Gi0/1
 ip address 172.16.8.98 255.255.255.252
ip ospf cost 1 no shutdown
!
interface Serial0/0/0
 description Primary Serial WAN to R1 (Area 0 Backbone)
 ip address 172.16.8.82 255.255.255.252
ip ospf cost 64 no shutdown
!
interface Serial0/0/1
 description Secondary Backup Serial WAN to R1
 ip address 172.16.8.86 255.255.255.252
ip ospf cost 500 no shutdown
!
router ospf 1
 router-id 172.16.8.107
 log-adjacency-changes
 network 172.16.8.80 0.0.0.3 area 0
 network 172.16.8.84 0.0.0.3 area 0
 network 172.16.8.96 0.0.0.3 area 0
 network 172.16.8.107 0.0.0.0 area 0
!
ip classless
ip forward-protocol nd
!
ip ssh version 2
!
banner motd ^C
================================================================================
AUTHORIZED ACCESS ONLY - DISASTER-RESILIENT SMART HOSPITAL NETWORK
================================================================================
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line aux 0
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end
